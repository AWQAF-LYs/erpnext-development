version: '3.8'

services:
  redis-cache:
    image: redis:6.2-alpine
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  frappe:
    image: ${DOKPLOY_IMAGE:-erpdbcluster-erpnext-q4tegw:latest}
    user: root
    working_dir: /home/frappe
    env_file:
      - ./.env
    environment:
      - MARIADB_HOST=proxysql
      - MARIADB_PORT=6033
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Required}
      - FRAPPE_ADMIN_PASSWORD=${FRAPPE_ADMIN_PASSWORD:?Required}
      - FRAPPE_SITE_NAME=${FRAPPE_SITE_NAME:?Required}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BACKUP_URL=${S3_BACKUP_URL:-}
      - SHELL=/bin/bash
    volumes:
      # FIXED: Changed destination path to prevent obliterating the container's native .pyenv system environment
      - /mnt/shared-erp-data:/storage
    ports: 
      - "${FRAPPE_HOST_PORT}:${FRAPPE_CONTAINER_PORT}"
      - "${SOCKETIO_HOST_PORT:-9000}:9000" 
    networks:
      - erpnext-network
    deploy:
      mode: replicated
      replicas: 1 # Keep at 1 for initial seeding, then scale to 3!
      restart_policy:
        condition: on-failure

networks:
  erpnext-network:
    external: true
