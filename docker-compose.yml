version: '3.8'

services:
  # Split Redis nodes for enterprise queuing and locking safety
  redis-cache:
    image: redis:6.2-alpine
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  frappe:
    image: frappe-custom:latest 
    user: root
    working_dir: /home/frappe
    env_file:
      - ./.env
    environment:
      - MARIADB_HOST=proxysql
      - MARIADB_PORT=6033
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Required}
      - FRAPPE_ADMIN_PASSWORD=${FRAPPE_ADMIN_PASSWORD:?Required}
      - FRAPPE_SITE_NAME=${FRAPPE_SITE_NAME:?Required}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BACKUP_URL=${S3_BACKUP_URL}
      - SHELL=/bin/bash
    volumes:
      # High-Availability GlusterFS mapping
      - /mnt/shared-erp-data:/home/frappe/frappe-bench/sites
    ports: 
      - "${FRAPPE_HOST_PORT}:${FRAPPE_CONTAINER_PORT}"
      - "${SOCKETIO_HOST_PORT:-9000}:9000" # Maps local unified supervisor socket server
    networks:
      - erpnext-network
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  erpnext-network:
    external: true
